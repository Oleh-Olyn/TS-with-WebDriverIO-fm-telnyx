name: WebDriverIO Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Allure results directory
        run: mkdir -p allure-results

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t telnyx-wdio-tests .

      - name: Run tests
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/allure-results:/app/allure-results" \
            telnyx-wdio-tests

      - name: Check Allure results
        if: always()
        run: |
          echo "Contents of allure-results:"
          ls -la allure-results || true
          find allure-results -type f -print || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn

  allure:
    needs: tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Check downloaded results
        run: |
          echo "Downloaded Allure results:"
          find allure-results -type f -print

      - name: Install Allure
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: |
          allure generate allure-results \
            --clean \
            -o allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy:
    needs: allure
    if: needs.allure.result == 'success'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
